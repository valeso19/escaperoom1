 }
}
function finish(lost){
 clearInterval(S.tick);S.secs=Math.floor((Date.now()-S.t0)/1000);

 o.map(function(t,i){return '<tr><td>'+(i+1)+'</td><td>'+t.e+' '+esc(t.n)+'</td><td>'+t.p+'</td><td>'+t.h+'</td></tr>'}).join('')+'</table></div>'+
 '<div class="card sub">Feliz cumpleaños, Giuliana. ¡Que tus 15 sean pura magia! 🦉✨</div><div style="text-align:center"><button id="again">Jugar de nuevo</button></div>';

var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches,AC,MUTE=false;
function snd(a){if(MUTE)return;try{var c=AC||(AC=new (window.AudioContext||window.webkitAudioContext)());a.forEach(function(f,k){var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='triangle';o.connect(g);g.connect(c.destination);var s=c.currentTime+k*.12;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.15,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.45)})}catch(e){}}
var cv=document.createElement('canvas');cv.id='fx';document.body.appendChild(cv);var cx=cv.getContext('2d'),P=[];

function burst(x,y,n,cols){if(RM)return;for(var i=0;i<n;i++){var a=Math.random()*6.283,v=2+Math.random()*5;P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60+Math.random()*40,c:cols[i%cols.length],s:2+Math.random()*3,g:.06})}}

function loop(){cx.clearRect(0,0,cv.width,cv.height);if(!RM)amb();for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;if(p.l<=0){P.splice(i,1);continue}cx.globalAlpha=Math.min(p.l/40,1);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(loop)}loop();
